MODULES libModernCombat3.so
# ARM EABI routines supplied by the softfp toolchain's libgcc.
PASSTHROUGH __aeabi_d2iz __aeabi_d2lz __aeabi_d2ulz __aeabi_dadd __aeabi_dmul __aeabi_dcmpgt __aeabi_dcmplt
PASSTHROUGH __aeabi_f2d __aeabi_f2lz __aeabi_f2ulz __aeabi_fcmpgt __aeabi_fcmplt __aeabi_i2d __aeabi_idiv
PASSTHROUGH __aeabi_idivmod __aeabi_l2d __aeabi_l2f __aeabi_ldivmod __aeabi_ul2d __aeabi_uldivmod
PASSTHROUGH __aeabi_uidiv __aeabi_uidivmod __aeabi_unwind_cpp_pr0 __aeabi_unwind_cpp_pr1
# Scalar / wchar ABI agrees: ARM EABI uses 32-bit wchar_t and wint_t.
PASSTHROUGH frexpf ldexpf wcscmp wcsncpy
PASSTHROUGH iswalpha iswcntrl iswdigit iswlower iswprint iswpunct iswspace iswupper iswxdigit
PASSTHROUGH isprint mbstowcs wcscpy
PASSTHROUGH lrintf llrintf expf logf sinhf tanhf floorf ceilf
# The MC3 build pulls the same C++ runtime pair as the SG build.
DATA __dso_handle b___dso_handle
